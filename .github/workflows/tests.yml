name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, extended]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run ${{ matrix.suite }} suite with runtime budgets
        run: ./tests/run_tests.sh "${{ matrix.suite }}"
