interface:
  display_name: "Game Walkthrough Builder"
  short_description: "Build source-traceable game guides"
  default_prompt: "Use $build-game-walkthrough to load the project's glossary and quirks, inventory enabled and actively used game systems, choose bounded deep audits where they affect the guide, audit its real chapter/objective structure, optional-content systems, battle events, boss classifications, enemy phases, encounter-local active battlers and loadout viability, and its player-facing recollection/gallery catalog; trace each scene's normal in-world acquisition separately from any catalog-wide unlock shortcut and verify live triggers, requirements, unlock writes, aliases, replay/viewer dispatch, and illustrated sets; then build all four source-traceable views in the walkthrough application."
