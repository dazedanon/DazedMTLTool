interface:
  display_name: "Game Walkthrough Builder"
  short_description: "Build source-traceable game guides"
  default_prompt: "Use $build-game-walkthrough to load the project's glossary and quirks, inventory enabled and actively used game systems, and choose bounded deep audits where they affect the guide. Audit the real chapter/objective structure; every companion or support recruit's success route, retryable refusal, permanent lockout, and point of no return; progression-critical vehicles, traversal abilities, required dungeon/item chains, shops, and capacity milestones; evidence-based regional danger and boss ordering, including unusual recovery, instant-loss, equipment-destruction, item-counter, player-state-triggered troop pages, and phase mechanics; battle events, boss classifications, enemy phases, encounter-local active battlers, and loadout viability; and the player-facing recollection/gallery catalog. Trace each scene's normal in-world acquisition separately from any catalog-wide unlock shortcut, prove its earliest Main Route availability anchor from story gates and prerequisite scenes, replace generic scene headings with source-backed player-recognizable titles while preserving exact catalog names, reverse-map combat scenes to exact enemies, encounter areas, and action/state sequences, and verify live triggers, requirements, unlock writes, aliases, replay/viewer dispatch, and illustrated sets. Then build all four source-traceable views with clear color-coded boss, optional, and scene cross-tab links."
