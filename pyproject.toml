[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = [
    ".tmp-ui",
    ".venv",
    "files",
    "log",
    "translated",
    "util/ace/offline",
    "util/wolfdawn/bin",
]

[tool.ruff.lint]
# Establish a low-noise fatal-error baseline before enabling broader families.
select = ["E9", "F63", "F7", "F82"]
